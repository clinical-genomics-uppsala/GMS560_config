jobs: 300
keep-going: True
restart-times: 2
rerun-incomplete: True
use-singularity: True
configfiles: ["config/config.yaml", "config/config.data.hg19.yaml", "GMS560_config/config/Berk/config_production_pipeline_berk.yaml", "GMS560_config/config/Berk/config_production_pipeline_ctdna.yaml"]
singularity-args: "-e --cleanenv --containall -B /berkscale/cgu -B /berkscale/cgu/tmp/gms_solid_tmp:/tmp -B $HOME"
singularity-prefix: "/berkscale/cgu/bin/apptainer_cache/"
wrapper-prefix: "git+file://berkscale/cgu/bin/shared_repos/snakemake-wrappers/"
drmaa: " -N 1-1 -t {resources.time} -n {resources.threads} --mem={resources.mem_mb} --mem-per-cpu={resources.mem_per_cpu} --mem-per-cpu={resources.mem_per_cpu} --partition=cpu_high -J {rule} -e slurm_out/{rule}_%j.err -o slurm_out/{rule}_%j.out"
drmaa-log-dir: "slurm_out"
default-resources: [threads=1, time="04:00:00", partition="cpu_high", mem_mb="8000", mem_per_cpu="8000"]
